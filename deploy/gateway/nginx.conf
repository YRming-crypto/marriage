worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_header_buffer_size 16k;
  large_client_header_buffers 4 128k;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  set_real_ip_from __TRUSTED_PROXY_CIDR__;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  server {
    listen 8080;
    client_max_body_size 10m;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /api/realtime/events {
      set $api_upstream http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      gzip off;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control "no-cache, no-transform" always;
      proxy_pass $api_upstream;
    }

    location /api/ {
      set $api_upstream http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
      proxy_pass $api_upstream;
    }

    location / {
      set $web_upstream http://web:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
      proxy_pass $web_upstream;
    }
  }
}
